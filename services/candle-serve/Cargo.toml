[package]
name = "candle-serve"
version = "0.0.1"
edition = "2021"
description = "Sub HTTP service exposing /v1/chat/completions for the superdocuments-bench/ocr candle-qwen-serve target. Currently a deterministic stub; real Qwen2.5-VL inference is deferred."

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"

[[bin]]
name = "candle-serve"
path = "src/main.rs"
