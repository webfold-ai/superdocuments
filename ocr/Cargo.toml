[package]
name = "superdocuments-bench-ocr"
version = "0.0.1"
edition = "2021"
description = "OCR inference-stack benchmark: candle / sglang / vllm / ai-gateway / litellm / bifrost / portkey on the same fixtures."

[features]
# candle is an opt-in feature so the default build doesn't pull the ML stack.
# Enable with: cargo run --features candle --release
default = []
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub", "dep:safetensors"]

[dependencies]
superdocuments = { path = "../../superdocuments" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }
futures-util = "0.3"

# candle stack — only when the `candle` feature is enabled.
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
tokenizers = { version = "0.21", optional = true }
hf-hub = { version = "0.3", optional = true }
safetensors = { version = "0.5", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bin]]
name = "superdocuments-bench-ocr"
path = "src/main.rs"
