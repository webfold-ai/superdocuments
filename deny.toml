# cargo-deny policy for superdocuments.
# Run from the repository root: cargo deny check advisories bans licenses sources

[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
ignore = []

[licenses]
version = 2
# Dependency licences only. The crate's own licence is the FSL in LICENSE and is not
# an SPDX identifier, so it is not listed here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Git sources the lock file needs today. Each must be a Ptyktos repository pinned to a revision
# in Cargo.toml. Remove an entry when its dependency moves to crates.io.
allow-git = [
    "https://github.com/Ptyktos/hashtrinity",
    "https://github.com/Ptyktos/framefold",
    "https://github.com/Ptyktos/transcode",
]
