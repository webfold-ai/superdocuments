name: Supply chain

on:
  pull_request:
    paths:
      - "**/*.toml"
      - "**/*.lock"
      - "src/**"
      - "calamine/**"
      - ".github/workflows/supply-chain.yml"
      - "deny.toml"
  push:
    branches: [main]
  schedule:
    - cron: "13 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: RustSec audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0 branch head
        with:
          # cargo-audit 0.22.2 needs rustc 1.88; the audit does not depend on the crate's MSRV.
          toolchain: 1.88.0
      - run: cargo install --locked cargo-audit
      - run: cargo audit --deny warnings

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0 branch head
        with:
          # cargo-deny 0.19.4 needs rustc 1.88; the policy check does not depend on the crate's MSRV.
          toolchain: 1.88.0
      - run: cargo install --locked cargo-deny --version 0.19.4
      - run: cargo deny check advisories bans licenses sources

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0 branch head
        with:
          toolchain: 1.85.0
      - run: cargo install --locked cargo-cyclonedx
      - name: Generate SBOM
        run: cargo cyclonedx --format json --override-filename superdocuments.sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: superdocuments-cyclonedx-sbom
          path: superdocuments.sbom.json
          retention-days: 90
