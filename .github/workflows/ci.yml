name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate private git dependencies
        env:
          SUBSTRATE_TOKEN: ${{ secrets.CARGO_SUBSTRATE_TOKEN }}
        run: |
          # wirefold is a private repository. With the token configured, git
          # fetches them as the token's owner; without it the job warns and the fetch fails
          # as before, so a missing secret is visible instead of silently ignored.
          if [ -z "${SUBSTRATE_TOKEN:-}" ]; then
            echo "::warning::CARGO_SUBSTRATE_TOKEN is not configured; private git dependencies cannot be fetched"
            exit 0
          fi
          git config --global url."https://x-access-token:${SUBSTRATE_TOKEN}@github.com/".insteadOf "https://github.com/"
      # Minimum supported Rust version (rust-version in Cargo.toml).
      - uses: dtolnay/rust-toolchain@599c45df1a24c1c63ae1129a7e59f46654b8fb66 # 1.89.0 branch head
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --locked --all-targets
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
