name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate private git dependencies
        env:
          SUBSTRATE_TOKEN: ${{ secrets.CARGO_SUBSTRATE_TOKEN }}
        run: |
          # wirefold is a private repository. With the token configured, git
          # fetches them as the token's owner; without it the job warns and the fetch fails
          # as before, so a missing secret is visible instead of silently ignored.
          if [ -z "${SUBSTRATE_TOKEN:-}" ]; then
            echo "::warning::CARGO_SUBSTRATE_TOKEN is not configured; private git dependencies cannot be fetched"
            exit 0
          fi
          git config --global url."https://x-access-token:${SUBSTRATE_TOKEN}@github.com/".insteadOf "https://github.com/"
      # Minimum supported Rust version (rust-version in Cargo.toml).
      - uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0 branch head
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --locked --all-targets
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  language-bindings:
    name: Python and WebAssembly bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate private git dependencies
        env:
          SUBSTRATE_TOKEN: ${{ secrets.CARGO_SUBSTRATE_TOKEN }}
        run: |
          if [ -z "${SUBSTRATE_TOKEN:-}" ]; then
            echo "::warning::CARGO_SUBSTRATE_TOKEN is not configured; private git dependencies cannot be fetched"
            exit 0
          fi
          git config --global url."https://x-access-token:${SUBSTRATE_TOKEN}@github.com/".insteadOf "https://github.com/"
      # The bindings need a newer Rust than the root crate's pin (PyO3, wasm-bindgen), so this job uses stable.
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown
      - name: Clippy (this crate only; the root crate is checked above)
        run: cargo clippy --locked -p superdocuments_bindings --no-deps --features python --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked -p superdocuments_bindings
      - name: Python extension and its tests
        run: superdocuments_bindings/scripts/test-python.sh
      - name: Install the wasm-bindgen CLI at the locked version
        run: |
          v="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')"
          cargo install --locked wasm-bindgen-cli --version "$v"
      - name: WebAssembly module and its tests
        run: |
          superdocuments_bindings/scripts/build-wasm.sh
          node superdocuments_bindings/tests/wasm/test.mjs
