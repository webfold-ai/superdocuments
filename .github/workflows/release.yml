name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The locked dependencies (zip, calamine, apeiron, wirefold) need rustc 1.89; this is the
      # toolchain `rust-version` names.
      - name: Install Rust 1.89.0
        run: rustup toolchain install 1.89.0 --profile minimal && rustup default 1.89.0
      - name: Check tag matches the crate version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          test "v${PACKAGE_VERSION}" = "${TAG_NAME}"
      - name: Test the tagged tree
        run: cargo test --locked
      - name: Package source archive
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="superdocuments-${TAG_NAME}/" \
            -o "dist/superdocuments-${TAG_NAME}.tar.gz" HEAD
          (cd dist && sha256sum "superdocuments-${TAG_NAME}.tar.gz" > SHA256SUMS)
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release artifacts (keyless sigstore bundles)
        run: |
          cd dist
          for f in superdocuments-*.tar.gz SHA256SUMS; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done
      - name: Generate SLSA build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/superdocuments-*.tar.gz"
      - name: Copy provenance bundle to the release assets
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          test -s "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" "dist/superdocuments-${TAG_NAME}.tar.gz.intoto.jsonl"
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cd dist
          gh release create "$TAG_NAME" --draft --generate-notes \
            superdocuments-*.tar.gz superdocuments-*.tar.gz.sigstore.json \
            superdocuments-*.tar.gz.intoto.jsonl SHA256SUMS SHA256SUMS.sigstore.json
