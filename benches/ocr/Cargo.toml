[package]
name = "superdocuments-bench-ocr"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "OCR inference-stack benchmark: candle / sglang / vllm / ai-gateway / litellm / bifrost / portkey on the same fixtures."

[features]
# candle is an opt-in feature so the default build doesn't pull the ML stack.
# Enable with: cargo run --features candle --release
default = []
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub", "dep:safetensors"]

[dependencies]
# Pinned: results name the exact superdocuments revision they measured. The pin points at
# this repo's own public GitHub home (webfold-ai/superdocuments) at the revision that was
# main when the bench moved in, so the measured crate is the crate that ships beside it.
# For local iteration against a sibling checkout, override with
# `[patch."https://github.com/webfold-ai/superdocuments"]`.
superdocuments = { git = "https://github.com/webfold-ai/superdocuments", rev = "ea1dbe5714a3923136c1dd61e3e4ae4051e13147" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }
futures-util = "0.3"

# marathondocbench lane (src/bin/marathondocbench.rs): PNG pages -> image-only PDFs, NFKC / regex / HTML-entity text normalisation.
png = { version = "0.18", default-features = false }
flate2 = "1"
unicode-normalization = "0.1"
regex = "1"
html-escape = "0.2"

# candle stack — only when the `candle` feature is enabled.
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
tokenizers = { version = "0.21", optional = true }
hf-hub = { version = "0.3", optional = true }
safetensors = { version = "0.5", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bin]]
name = "superdocuments-bench-ocr"
path = "src/main.rs"

[[bin]]
name = "marathondocbench"
path = "src/bin/marathondocbench.rs"
