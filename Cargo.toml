[workspace]
[package]
name = "superdocuments"
version = "0.8.1"
edition = "2021"
rust-version = "1.85"
license-file = "LICENSE"
description = "Ptyktos shared document parsing and conversion APIs"

[features]
default = []
framefold = ["dep:framefold"]
framefold-js = ["framefold", "framefold/js"]
# Re-exports the Transcode image/audio/video codecs as `superdocuments::media_codecs`.
media-codecs = ["dep:transcode"]
# Embedded-image extraction in the PDF parser (`Document::images`, `PdfImage::to_png`): JPEG decode
# and PNG encode go through Transcode.
images = ["dep:transcode"]

[dependencies]
framefold = { git = "https://github.com/Ptyktos/framefold", rev = "5a097c2e2448640c79d43b37b9246d0f7baea0d4", default-features = false, optional = true }
quick-xml = "0.42"
encoding_rs = "0.8"
zip = { version = "9", default-features = false, features = ["deflate"] }
hashtrinity = { git = "https://github.com/Ptyktos/hashtrinity", rev = "2c36b995c82c073c71df7c28b14c62665d62cbf0", features = ["syntax"] }
# The O(1) borrowed-key map used for the EPUB manifest index. Same shape
# as `calamine-apeiron`'s relationship / path caches. Path dep because
# apeiron has no published crate yet; see the calamine-apeiron APEIRON-FORK.md
# note for the same constraint.
apeiron = { path = "/home/ctown/orca/apeiron" }
# Media codecs only, behind `images` / `media-codecs`. The HTML and PDF document code that used to
# come from Transcode's `doc` module (not part of the GitHub Transcode) now lives in this crate.
transcode = { git = "https://github.com/Ptyktos/transcode", rev = "f855e4217105863354f58c1d1c840685fff6e44b", optional = true }
# `lopdf` (pure-Rust PDF parser, MIT) — used by the AcroForm repair lift from
# LiteParse. It walks pages + annotations without going through Transcode.
lopdf = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

