[workspace]
members = ["calamine"]
# calamine/fuzz is a cargo-fuzz crate built on its own.
exclude = ["calamine/fuzz"]

[package]
name = "superdocuments"
version = "0.8.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Ptyktos shared document parsing and conversion APIs"

[features]
default = []
framefold = ["dep:framefold"]
framefold-js = ["framefold", "framefold/js"]
# Re-exports the Transcode image/audio/video codecs as `superdocuments::media_codecs`.
media-codecs = ["dep:transcode"]
# Embedded-image extraction in the PDF parser (`Document::images`, `PdfImage::to_png`): JPEG decode
# and PNG encode go through Transcode.
images = ["dep:transcode"]

[dependencies]
framefold = { git = "https://github.com/Ptyktos/framefold", rev = "5a097c2e2448640c79d43b37b9246d0f7baea0d4", default-features = false, optional = true }
quick-xml = "0.42"
encoding_rs = "0.8"
zip = { version = "9", default-features = false, features = ["deflate"] }
hashtrinity = { git = "https://github.com/Ptyktos/hashtrinity", rev = "2c36b995c82c073c71df7c28b14c62665d62cbf0", features = ["syntax"] }
# The O(1) borrowed-key map used for the EPUB manifest index. Same shape
# as the relationship / path caches in `calamine/`. apeiron has no published crate; its history
# lives on the `apeiron` branch of Ptyktos/hashtrinity (Ptyktos/apeiron is gone). 255ca30 is that
# branch's Apache-2.0 tip; the previous pin, a2b5093, carried a GPL-3.0 LICENSE.
apeiron = { git = "https://github.com/Ptyktos/hashtrinity", rev = "255ca3018a0f06300153d905cb19b37ea548bb56" }
# Media codecs only, behind `images` / `media-codecs`. The HTML and PDF document code that used to
# come from Transcode's `doc` module (not part of the GitHub Transcode) now lives in this crate.
transcode = { git = "https://github.com/Ptyktos/transcode", rev = "8e65c5afeb8adb9663511760b80e19156970207e", optional = true }
# `lopdf` (pure-Rust PDF parser, MIT) — used by the AcroForm repair lift from
# LiteParse. It walks pages + annotations without going through Transcode.
lopdf = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]


# hashtrinity (and anything else pinned before the move) still names Ptyktos/apeiron, which no
# longer exists; redirect that source to the same commit on the hashtrinity `apeiron` branch.
[patch."https://github.com/Ptyktos/apeiron"]
apeiron = { git = "https://github.com/Ptyktos/hashtrinity", rev = "255ca3018a0f06300153d905cb19b37ea548bb56" }
