[workspace]
members = ["calamine"]
# calamine/fuzz is a cargo-fuzz crate built on its own.
exclude = ["calamine/fuzz"]

[package]
name = "superdocuments"
version = "0.9.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Ptyktos shared document parsing and conversion APIs"

[features]
default = []
framefold = ["dep:framefold"]
framefold-js = ["framefold", "framefold/js"]
# Re-exports the Transcode image/audio/video codecs as `superdocuments::media_codecs`.
media-codecs = ["dep:transcode"]
# Embedded-image extraction in the PDF parser (`Document::images`, `PdfImage::to_png`): JPEG decode
# and PNG encode go through Transcode.
images = ["dep:transcode"]

[dependencies]
framefold = { git = "https://github.com/Ptyktos/framefold", rev = "5a097c2e2448640c79d43b37b9246d0f7baea0d4", default-features = false, optional = true }
quick-xml = "0.42"
encoding_rs = "0.8"
zip = { version = "9", default-features = false, features = ["deflate"] }
wirefold = { version = "0.1.0", git = "https://github.com/webfold-ai/wirefold", rev = "ba9a71284844cd1a7f14ae3b7105ad972aaa9e07", default-features = false, features = ["syntax"] }
# The O(1) borrowed-key table (`apeiron::freq::Table`, zero-allocation `get_at(&str)`) used for the EPUB
# manifest index and the XLSX/XLSB path and relationship caches in `calamine/`.
apeiron = { version = "0.1.0", git = "https://github.com/webfold-ai/apeiron", rev = "d0eda3226193542949306f767d7280404921546f" }
# Legacy BIFF (`.xls`) reader, the workspace member in `calamine/`. Its default features are empty;
# the `chrono` and `picture` features stay off.
calamine = { path = "calamine", version = "0.36.1", default-features = false }
# Media codecs only, behind `images` / `media-codecs`. The HTML and PDF document code that used to
# come from Transcode's `doc` module (not part of the GitHub Transcode) now lives in this crate.
transcode = { git = "https://github.com/Ptyktos/transcode", rev = "8e65c5afeb8adb9663511760b80e19156970207e", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
